<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noether 플레이그라운드</title>
<meta name="description" content="변수가 파동이고 메모리에 온도가 있는 프로그래밍 언어를 브라우저에서 실행합니다.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <img src="logo.svg" alt="" width="26" height="26">
  <h1>Noether</h1>
  <label class="sr" for="examples">예제</label>
  <select id="examples"></select>
  <button id="run" disabled>실행</button>
  <button id="stop" hidden>중지</button>
  <nav id="links" hidden>
    <a id="link-syntax">문법</a>
    <a id="link-repo">소스 코드</a>
  </nav>
</header>

<main>
  <section class="source" aria-label="코드">
    <div class="editor">
      <div class="levels" aria-hidden="true"><i style="--n:1"></i><i style="--n:4"></i><i style="--n:9"></i><i style="--n:16"></i><i style="--n:25"></i></div>
      <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" aria-label="Noether 소스 코드"></textarea>
    </div>
    <p id="verdict" role="status" hidden></p>
  </section>

  <section class="result" aria-label="실행 결과">
    <div class="views" role="group" aria-label="보기">
      <button id="view-heat" aria-pressed="true">온도</button>
      <button id="view-wave" aria-pressed="false">파동</button>
    </div>
    <div class="plot" id="plot">
      <canvas id="heat" tabindex="0" aria-label="메모리 타일별 시간에 따른 온도"></canvas>
      <canvas id="wave" tabindex="0" aria-label="틱별 변수의 파동" hidden></canvas>
      <div class="tip" id="tip" hidden></div>
    </div>
    <div class="scrub" id="scrub" hidden>
      <button id="play">재생</button>
      <input id="frame" type="range" min="0" max="0" value="0" aria-label="틱 선택">
      <span id="frame-tick"></span>
    </div>
    <div class="caption">
      <span id="summary"></span>
      <span class="key"><canvas id="legend" width="120" height="8" aria-hidden="true"></canvas>임계<i aria-hidden="true"></i>초과</span>
    </div>
    <section class="terminal" aria-label="터미널">
      <div class="titlebar"><h2>터미널</h2><span id="state"></span></div>
      <div id="screen"><span id="output"></span><span id="fault"></span><input id="stdin" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="프로그램에 보낼 입력" hidden></div>
    </section>
  </section>
</main>
<script src="app.js" type="module"></script>
</body>
</html>
